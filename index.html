<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proofly - Proof-of-Learning Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spinner {
            border: 3px solid #e5e7eb;
            border-top: 3px solid #6b7280;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app">
        <!-- Loading -->
        <div id="loading-screen" class="fixed inset-0 bg-white flex items-center justify-center z-50">
            <div class="text-center">
                <div class="spinner mx-auto mb-4"></div>
                <p class="text-gray-500">Loading Proofly...</p>
            </div>
        </div>

        <!-- Auth -->
        <div id="auth-container" class="hidden min-h-screen flex items-center justify-center p-4">
            <div id="login-form" class="w-full max-w-md fade-in">
                <div class="bg-white rounded-2xl shadow-lg p-8 border border-gray-100">
                    <div class="text-center mb-8">
                        <h1 class="text-3xl font-bold text-gray-800">📚 Proofly</h1>
                        <p class="text-gray-500 mt-2">Track your learning journey</p>
                    </div>
                    <div id="login-error" class="hidden bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm"></div>
                    <div class="space-y-4">
                        <input type="email" id="login-email" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-gray-400 focus:outline-none" placeholder="Email">
                        <input type="password" id="login-password" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-gray-400 focus:outline-none" placeholder="Password">
                        <button onclick="handleLogin()" class="w-full bg-gray-800 text-white py-3 rounded-lg font-medium hover:bg-gray-700 transition">Sign In</button>
                    </div>
                    <p class="text-center mt-6 text-gray-500">Don't have an account? <a href="#" onclick="showSignup()" class="text-gray-800 font-medium hover:underline">Sign up</a></p>
                </div>
            </div>
            <div id="signup-form" class="hidden w-full max-w-md fade-in">
                <div class="bg-white rounded-2xl shadow-lg p-8 border border-gray-100">
                    <div class="text-center mb-8">
                        <h1 class="text-3xl font-bold text-gray-800">📚 Proofly</h1>
                        <p class="text-gray-500 mt-2">Create your account</p>
                    </div>
                    <div id="signup-error" class="hidden bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm"></div>
                    <div class="space-y-4">
                        <input type="text" id="signup-username" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-gray-400 focus:outline-none" placeholder="Username">
                        <input type="email" id="signup-email" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-gray-400 focus:outline-none" placeholder="Email">
                        <input type="password" id="signup-password" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-gray-400 focus:outline-none" placeholder="Password (min 6 chars)">
                        <button onclick="handleSignup()" class="w-full bg-gray-800 text-white py-3 rounded-lg font-medium hover:bg-gray-700 transition">Create Account</button>
                    </div>
                    <p class="text-center mt-6 text-gray-500">Already have an account? <a href="#" onclick="showLogin()" class="text-gray-800 font-medium hover:underline">Sign in</a></p>
                </div>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard-container" class="hidden">
            <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
                <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
                    <h1 class="text-xl font-bold text-gray-800">📚 Proofly</h1>
                    <div class="flex items-center gap-4">
                        <span id="user-display" class="text-gray-600 text-sm"></span>
                        <button onclick="handleLogout()" class="text-gray-500 hover:text-gray-700 text-sm font-medium">Logout</button>
                    </div>
                </div>
            </header>
            <main class="max-w-6xl mx-auto px-4 py-8">
                <div class="mb-8">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-gray-800">Your Skills</h2>
                        <button onclick="showAddSkillModal()" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition">+ Add Skill</button>
                    </div>
                    <div id="skills-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                    <div id="no-skills" class="hidden bg-white rounded-xl border border-gray-200 p-12 text-center">
                        <p class="text-gray-500">No skills added yet.</p>
                    </div>
                </div>
                <div id="skill-detail" class="hidden fade-in">
                    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                        <div class="p-6 border-b border-gray-100 flex items-center justify-between flex-wrap gap-4">
                            <div>
                                <h2 id="detail-skill-name" class="text-2xl font-bold text-gray-900"></h2>
                                <p id="detail-total-time" class="text-gray-500 text-sm mt-1"></p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="copyProofLink()" class="text-gray-600 border border-gray-200 p-2 rounded-lg hover:bg-gray-50 transition">Share Proof</button>
                                <button onclick="showAddEntryModal()" class="bg-gray-900 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-black transition">Log Entry</button>
                            </div>
                        </div>
                        <div id="entries-list" class="divide-y divide-gray-100"></div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Modals -->
        <div id="add-skill-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
            <div class="bg-white rounded-xl w-full max-w-md p-6">
                <h3 class="text-lg font-semibold mb-4">Add New Skill</h3>
                <input type="text" id="new-skill-name" class="w-full px-4 py-3 border border-gray-200 rounded-lg mb-4" placeholder="e.g. Python">
                <div class="flex gap-3">
                    <button onclick="hideAddSkillModal()" class="flex-1 px-4 py-3 border rounded-lg">Cancel</button>
                    <button onclick="handleAddSkill()" class="flex-1 px-4 py-3 bg-gray-800 text-white rounded-lg">Add</button>
                </div>
            </div>
        </div>
        <div id="add-entry-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
            <div class="bg-white rounded-xl w-full max-w-md p-6">
                <h3 id="entry-modal-title" class="text-lg font-semibold mb-4">Log Entry</h3>
                <div class="space-y-4">
                    <input type="date" id="entry-date" class="w-full px-4 py-2 border rounded-lg">
                    <input type="number" id="entry-time" class="w-full px-4 py-2 border rounded-lg" placeholder="Minutes spent">
                    <input type="text" id="entry-studied" class="w-full px-4 py-2 border rounded-lg" placeholder="What did you study?">
                    <textarea id="entry-takeaway" class="w-full px-4 py-2 border rounded-lg" placeholder="Key takeaway"></textarea>
                </div>
                <div class="flex gap-3 mt-6">
                    <button onclick="hideAddEntryModal()" class="flex-1 px-4 py-2 border rounded-lg">Cancel</button>
                    <button onclick="handleAddEntry()" class="flex-1 px-4 py-2 bg-gray-800 text-white rounded-lg">Save</button>
                </div>
            </div>
        </div>

        <div id="toast" class="hidden fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg z-50 fade-in">
            <span id="toast-message"></span>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        let currentUser = null, skills = [], selectedSkill = null, entries = [], editingEntryId = null;

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('proof')) { window.location.href = `/api/proof/${urlParams.get('proof')}`; return; }
            await checkAuth();
        }

        async function checkAuth() {
            try {
                const res = await fetch(`${API_BASE}/me`);
                const data = await res.json();
                if (data.user) { currentUser = data.user; showDashboard(); }
                else { showAuth(); }
            } catch(e) { showAuth(); }
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value, password = document.getElementById('login-password').value;
            const res = await fetch(`${API_BASE}/login`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            });
            const data = await res.json();
            if (res.ok) { currentUser = data.user; showDashboard(); }
            else { showError('login-error', data.error); }
        }

        async function handleSignup() {
            const username = document.getElementById('signup-username').value, 
                  email = document.getElementById('signup-email').value, 
                  password = document.getElementById('signup-password').value;
            const res = await fetch(`${API_BASE}/signup`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, email, password})
            });
            const data = await res.json();
            if (res.ok) { currentUser = data.user; showDashboard(); }
            else { showError('signup-error', data.error); }
        }

        async function handleLogout() {
            await fetch(`${API_BASE}/logout`, {method: 'POST'});
            currentUser = null; showAuth();
        }

        async function loadSkills() {
            const res = await fetch(`${API_BASE}/skills`);
            const data = await res.json();
            skills = data.skills || [];
            renderSkills();
        }

        async function handleAddSkill() {
            const name = document.getElementById('new-skill-name').value;
            const res = await fetch(`${API_BASE}/skills`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name})
            });
            if (res.ok) { hideAddSkillModal(); loadSkills(); }
        }

        async function selectSkill(id) {
            selectedSkill = skills.find(s => s.id === id);
            document.getElementById('skill-detail').classList.remove('hidden');
            document.getElementById('detail-skill-name').textContent = selectedSkill.name;
            await loadEntries();
        }

        async function loadEntries() {
            const res = await fetch(`${API_BASE}/skills/${selectedSkill.id}/entries`);
            const data = await res.json();
            entries = data.entries || [];
            renderEntries();
        }

        async function handleAddEntry() {
            const payload = {
                date: document.getElementById('entry-date').value,
                time_spent: document.getElementById('entry-time').value,
                what_studied: document.getElementById('entry-studied').value,
                key_takeaway: document.getElementById('entry-takeaway').value
            };
            const url = editingEntryId ? `${API_BASE}/entries/${editingEntryId}` : `${API_BASE}/skills/${selectedSkill.id}/entries`;
            const res = await fetch(url, {
                method: editingEntryId ? 'PUT' : 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if (res.ok) { hideAddEntryModal(); loadEntries(); loadSkills(); }
        }

        function renderSkills() {
            const container = document.getElementById('skills-list');
            container.innerHTML = skills.map(s => `
                <div onclick="selectSkill(${s.id})" class="bg-white p-5 rounded-xl border border-gray-200 cursor-pointer hover:shadow-md transition">
                    <h3 class="font-bold text-gray-800">${s.name}</h3>
                    <p class="text-sm text-gray-500 mt-2">${s.total_time} mins spent • ${s.entry_count} entries</p>
                </div>
            `).join('');
            document.getElementById('no-skills').classList.toggle('hidden', skills.length > 0);
        }

        function renderEntries() {
            const container = document.getElementById('entries-list');
            container.innerHTML = entries.map(e => `
                <div class="p-4 hover:bg-gray-50 transition flex justify-between items-start">
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase">${e.date} • ${e.time_spent}m</p>
                        <h4 class="font-semibold text-gray-900">${e.what_studied}</h4>
                        <p class="text-sm text-gray-600 italic">"${e.key_takeaway}"</p>
                    </div>
                </div>
            `).join('');
        }

        function showAuth() { 
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('dashboard-container').classList.add('hidden');
        }
        function showDashboard() {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('dashboard-container').classList.remove('hidden');
            document.getElementById('user-display').textContent = `Hi, ${currentUser.username}`;
            loadSkills();
        }
        function showSignup() { document.getElementById('login-form').classList.add('hidden'); document.getElementById('signup-form').classList.remove('hidden'); }
        function showLogin() { document.getElementById('login-form').classList.remove('hidden'); document.getElementById('signup-form').classList.add('hidden'); }
        function showAddSkillModal() { document.getElementById('add-skill-modal').classList.remove('hidden'); }
        function hideAddSkillModal() { document.getElementById('add-skill-modal').classList.add('hidden'); }
        function showAddEntryModal() { document.getElementById('add-entry-modal').classList.remove('hidden'); document.getElementById('entry-date').value = new Date().toISOString().split('T')[0]; }
        function hideAddEntryModal() { document.getElementById('add-entry-modal').classList.add('hidden'); editingEntryId = null; }
        function showError(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.classList.remove('hidden'); }
        function copyProofLink() {
            const url = `${window.location.origin}/api/proof/${selectedSkill.public_id}`;
            navigator.clipboard.writeText(url).then(() => alert('Public link copied!'));
        }

        init();
    </script>
</body>
</html>
